name: Deploy to VPS2

# Ships the built site to VPS2, purges the Cloudflare cache for the docs paths,
# and pings IndexNow. VPS1 — the trading platform — is never touched by this
# workflow, by design: a docs deploy must not be able to break trading.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#
#   VPS2_SSH_KEY          private key authorised on VPS2 for the deploy user
#   VPS2_HOST             VPS2 hostname or IP
#   VPS2_USER             SSH user
#   VPS2_KNOWN_HOSTS      output of `ssh-keyscan <host>` — pins the host key so
#                         a MITM cannot receive the deploy
#   CLOUDFLARE_API_TOKEN  token with Cache Purge on the zone
#   INDEXNOW_KEY          the key whose .txt lives at /docs/<key>.txt
#
# Until those exist the job short-circuits with a notice instead of failing, so
# a missing secret does not show up as a red X on every push.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps2
  cancel-in-progress: false

env:
  ZONE_ID: e2cd6f58436c3da544112532c2eec8cd
  WEB_ROOT: /var/www/metastation-docs
  SITE: https://metastation.fi

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy secrets are configured
        id: gate
        run: |
          if [ -z "${{ secrets.VPS2_SSH_KEY }}" ] || [ -z "${{ secrets.VPS2_HOST }}" ]; then
            echo "::notice::Deploy secrets not configured — skipping. See the header of this workflow."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          fetch-depth: 0   # sitemap lastmod comes from commit dates

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 20
          cache: npm

      - run: npm ci --no-audit --no-fund
        if: steps.gate.outputs.ready == 'true'

      - name: Build
        if: steps.gate.outputs.ready == 'true'
        env:
          DOCUSAURUS_STRICT_LINKS: 'true'
        run: npm run build

      - name: Leak check
        if: steps.gate.outputs.ready == 'true'
        run: |
          fail=0
          for term in hyperliquid symbiosis docs-origin; do
            if grep -ril "$term" build/ >/dev/null 2>&1; then
              echo "::error::'$term' appears in the build output — refusing to deploy"
              grep -ril "$term" build/ | head -10
              fail=1
            fi
          done
          exit $fail

      - name: Set up SSH
        if: steps.gate.outputs.ready == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS2_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VPS2_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload and swap
        if: steps.gate.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.VPS2_HOST }}
          USER: ${{ secrets.VPS2_USER }}
        run: |
          # Staged upload then an atomic swap: the site is never served from a
          # half-uploaded tree. rsync is avoided so this matches the local
          # deploy script, which runs on Git Bash where rsync is absent.
          ssh -o BatchMode=yes "$USER@$HOST" "rm -rf ${WEB_ROOT}.new && mkdir -p ${WEB_ROOT}.new"
          tar -czf - -C build . | ssh -o BatchMode=yes "$USER@$HOST" "tar -xzf - -C ${WEB_ROOT}.new"
          ssh -o BatchMode=yes "$USER@$HOST" "
            set -e
            rm -rf ${WEB_ROOT}.old
            if [ -d ${WEB_ROOT} ]; then mv ${WEB_ROOT} ${WEB_ROOT}.old; fi
            mv ${WEB_ROOT}.new ${WEB_ROOT}
            rm -rf ${WEB_ROOT}.old
          "

      - name: Purge Cloudflare cache
        if: steps.gate.outputs.ready == 'true'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN unset — pages refresh within the 1h edge TTL"
            exit 0
          fi
          # Prefix purge, not purge-everything: purging the whole zone would
          # also evict the trading app's assets, which this project has no
          # business touching.
          resp=$(curl -s -X POST \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"prefixes":["metastation.fi/docs","metastation.fi/blogs","metastation.fi/assets","metastation.fi/img"]}')
          echo "$resp" | grep -q '"success":true' \
            && echo "purged" \
            || echo "::warning::purge failed: $resp"

      - name: IndexNow
        if: steps.gate.outputs.ready == 'true'
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          if [ -z "$INDEXNOW_KEY" ]; then
            echo "::warning::INDEXNOW_KEY unset — skipping"
            exit 0
          fi
          # Covers Bing, Yandex, Naver, Seznam and Yep, and downstream
          # DuckDuckGo and Copilot. Google supports neither IndexNow nor the
          # retired sitemap ping endpoint, so it is not addressed here.
          urls=$(grep -o '<loc>[^<]*</loc>' build/sitemap.xml | sed 's/<[^>]*>//g' \
                 | jq -R -s -c 'split("\n") | map(select(length > 0))')
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json" \
            --data "{\"host\":\"metastation.fi\",\"key\":\"$INDEXNOW_KEY\",\"keyLocation\":\"${SITE}/docs/${INDEXNOW_KEY}.txt\",\"urlList\":$urls}")
          case "$code" in
            200|202) echo "IndexNow accepted ($code)" ;;
            *) echo "::warning::IndexNow returned HTTP $code" ;;
          esac
